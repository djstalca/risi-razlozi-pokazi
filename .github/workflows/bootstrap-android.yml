name: Bootstrap Android Native Project

on:
  push:
    branches: [play-store-production-ready]
    paths:
      - '.github/workflows/bootstrap-android.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play-store-production-ready
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run android:init
      - run: npm run android:verify
      - name: Commit native Android project, lockfile and generated brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android assets store-assets
          git commit -m "Bootstrap Android native project and release assets"
          git push origin HEAD:play-store-production-ready
